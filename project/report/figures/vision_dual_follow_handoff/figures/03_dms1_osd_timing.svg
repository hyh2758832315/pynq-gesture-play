</defs><g font-family="Microsoft YaHei" fill="#172b3a">
<rect x="60" y="240" width="2080" height="485" rx="0" fill="#edf5fb" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="278.0" text-anchor="start" font-size="27" font-weight="600">DMS1 / 每帧 460,864 B：像素对 460,800 B + 尾部 64 B</text>
<rect x="60" y="765" width="2080" height="345" rx="0" fill="#fff0f6" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="803.0" text-anchor="start" font-size="27" font-weight="600">OSD / 6 个 32 bit 影子寄存器 + COMMIT</text>
<rect x="60" y="1150" width="2080" height="520" rx="0" fill="#ffffff" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="1188.0" text-anchor="start" font-size="27" font-weight="600">跨时钟提交 / 控制线程与像素扫描解耦</text>
<path d="M430,1295 L430,1650" fill="none" stroke="#d8dfe7" stroke-width="2.7" marker-end="url(#arrow3)" stroke-dasharray="9 6"/>
<path d="M1090,1295 L1090,1650" fill="none" stroke="#d8dfe7" stroke-width="2.7" marker-end="url(#arrow3)" stroke-dasharray="9 6"/>
<path d="M1800,1295 L1800,1650" fill="none" stroke="#d8dfe7" stroke-width="2.7" marker-end="url(#arrow3)" stroke-dasharray="9 6"/>
<path d="M430,1350 L1090,1350" fill="none" stroke="#bf286e" stroke-width="2.7" marker-end="url(#arrow2)"/>
<path d="M1090,1415 L1800,1415" fill="none" stroke="#25638d" stroke-width="2.7" marker-end="url(#arrow1)"/>
<path d="M1800,1580 L1090,1580" fill="none" stroke="#197b71" stroke-width="2.7" marker-end="url(#arrow0)"/>
<path d="M1090,1640 L430,1640" fill="none" stroke="#bf286e" stroke-width="2.7" marker-end="url(#arrow2)"/>
<text x="1100.0" y="49.14" text-anchor="middle" font-size="21" font-weight="600">PYNQ  /  视觉识别与双路跟随  /  03  编码与时序</text>
<text x="1100.0" y="129.98" text-anchor="middle" font-size="47" font-weight="600">双掩膜编码与无阻塞 OSD 提交</text>
<text x="1100.0" y="196.5" text-anchor="middle" font-size="25" font-weight="600">DMS1 保证同帧数据完整；OSD 用冻结 mailbox 跨时钟，在 HDMI 帧边界更新。</text>
<text x="1100.0" y="1781.62" text-anchor="middle" font-size="18" font-weight="600">GESTURE PLAY  ·  BUILD_ID 0xC0061000  ·  源码机制示意</text>
<rect x="100" y="335" width="225" height="91" rx="6" fill="#edf8f5" stroke="#197b71" stroke-width="2"/>
<text x="212.5" y="372.75" text-anchor="middle" font-size="25" font-weight="600">raw[0]</text>
<text x="212.5" y="405.25" text-anchor="middle" font-size="25" font-weight="400">8 bit</text>
<rect x="325" y="335" width="225" height="91" rx="6" fill="#fff0f6" stroke="#bf286e" stroke-width="2"/>
<text x="437.5" y="372.75" text-anchor="middle" font-size="25" font-weight="600">filtered[0]</text>
<text x="437.5" y="405.25" text-anchor="middle" font-size="25" font-weight="400">8 bit</text>
<rect x="550" y="335" width="225" height="91" rx="6" fill="#edf8f5" stroke="#197b71" stroke-width="2"/>
<text x="662.5" y="372.75" text-anchor="middle" font-size="25" font-weight="600">raw[1]</text>
<text x="662.5" y="405.25" text-anchor="middle" font-size="25" font-weight="400">8 bit</text>
<rect x="775" y="335" width="225" height="91" rx="6" fill="#fff0f6" stroke="#bf286e" stroke-width="2"/>
<text x="887.5" y="372.75" text-anchor="middle" font-size="25" font-weight="600">filtered[1]</text>
<text x="887.5" y="405.25" text-anchor="middle" font-size="25" font-weight="400">8 bit</text>
<rect x="1050" y="335" width="350" height="91" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="1225.0" y="373.06" text-anchor="middle" font-size="24" font-weight="600">… 640 × 360 像素</text>
<text x="1225.0" y="404.26" text-anchor="middle" font-size="24" font-weight="400">内存字节顺序</text>
<rect x="1460" y="335" width="630" height="91" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="1775.0" y="373.06" text-anchor="middle" font-size="24" font-weight="600">16 × uint32 尾部</text>
<text x="1775.0" y="404.26" text-anchor="middle" font-size="24" font-weight="400">小端布局；CRC32 覆盖此前全部字节</text>
<text x="1095.0" y="483.66" text-anchor="middle" font-size="24" font-weight="600">raw 仅为 0/255；filtered 为 0–255 平滑值。每个 32 bit 负载字打包两个像素对。</text>
<rect x="100" y="535" width="460" height="125" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="330.0" y="574.4599999999999" text-anchor="middle" font-size="24" font-weight="600">身份</text>
<text x="330.0" y="605.66" text-anchor="middle" font-size="24" font-weight="400">MAGIC / ABI</text>
<text x="330.0" y="636.8599999999999" text-anchor="middle" font-size="24" font-weight="400">frame_id / config_id / epoch</text>
<rect x="610" y="535" width="460" height="125" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="840.0" y="574.4599999999999" text-anchor="middle" font-size="24" font-weight="600">几何与长度</text>
<text x="840.0" y="605.66" text-anchor="middle" font-size="24" font-weight="400">width / height / pixels</text>
<text x="840.0" y="636.8599999999999" text-anchor="middle" font-size="24" font-weight="400">payload_bytes / status</text>
<rect x="1120" y="535" width="460" height="125" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="1350.0" y="574.4599999999999" text-anchor="middle" font-size="24" font-weight="600">配置与格式</text>
<text x="1350.0" y="605.66" text-anchor="middle" font-size="24" font-weight="400">6 个 HSV 阈值字节</text>
<text x="1350.0" y="636.8599999999999" text-anchor="middle" font-size="24" font-weight="400">PAIR_FORMAT = 0x00010802</text>
<rect x="1630" y="535" width="460" height="125" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="1860.0" y="574.4599999999999" text-anchor="middle" font-size="24" font-weight="600">末尾校验</text>
<text x="1860.0" y="605.66" text-anchor="middle" font-size="24" font-weight="400">保留字为 0</text>
<text x="1860.0" y="636.8599999999999" text-anchor="middle" font-size="24" font-weight="400">CRC32：多项式 0xEDB88320</text>
<rect x="90" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="250.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x10 / FLAGS</text>
<text x="250.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">enable · valid · fist</text>
<rect x="430" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="590.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x14 / XY</text>
<text x="590.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">X | (Y &lt;&lt; 16)</text>
<rect x="770" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="930.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x18 / 保留</text>
<text x="930.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">0</text>
<rect x="1110" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="1270.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x1C / TTL</text>
<text x="1270.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">剩余帧数 &lt;&lt; 16</text>
<rect x="1450" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="1610.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x20 / HAND_SEQ</text>
<text x="1610.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">新观察序号</text>
<rect x="1790" y="850" width="320" height="100" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="1950.0" y="892.56" text-anchor="middle" font-size="24" font-weight="600">0x24 / 保留</text>
<text x="1950.0" y="923.76" text-anchor="middle" font-size="24" font-weight="400">0</text>
<text x="1095.0" y="1019.56" text-anchor="middle" font-size="24" font-weight="600">先读 BUSY：忙则跳过本次提交，不排队；空闲时写 6 个字，再写 0x08 = 1。</text>
<text x="1095.0" y="1050.76" text-anchor="middle" font-size="24" font-weight="400">重复帧不刷新原始来源时间；250 ms 新鲜度预算换算为剩余扫描帧，序号重复不续命。</text>
<rect x="220" y="1230" width="420" height="65" rx="6" fill="#fff0f6" stroke="#bf286e" stroke-width="2"/>
<text x="430.0" y="1271.0" text-anchor="middle" font-size="25" font-weight="600">PS OSD 线程</text>
<text x="430.5" y="1650.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<rect x="880" y="1230" width="420" height="65" rx="6" fill="#edf5fb" stroke="#25638d" stroke-width="2"/>
<text x="1090.0" y="1271.0" text-anchor="middle" font-size="25" font-weight="600">AXI-Lite mailbox</text>
<text x="1090.5" y="1650.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<rect x="1590" y="1230" width="420" height="65" rx="6" fill="#edf8f5" stroke="#197b71" stroke-width="2"/>
<text x="1800.0" y="1271.0" text-anchor="middle" font-size="25" font-weight="600">像素时钟域</text>
<text x="1800.5" y="1650.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="430.5" y="1350.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1090.5" y="1350.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1090.5" y="1415.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1800.5" y="1415.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<rect x="1545" y="1460" width="510" height="64" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="1800.0" y="1500.16" text-anchor="middle" font-size="24" font-weight="600">帧边界：切换 active_cfg</text>
<text x="1800.5" y="1580.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1090.5" y="1580.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1090.5" y="1640.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="430.5" y="1640.84" text-anchor="middle" font-size="1" font-weight="600"></text>
<text x="1100.0" y="1731.82" text-anchor="middle" font-size="23" font-weight="600">OSD 线程目标 30 Hz，HDMI 扫描 60 Hz；这些是配置节拍，不能替代实际识别 FPS 或端到端延迟。</text>
<rect x="588.1796875" y="1311" width="343.640625" height="32" fill="#ffffff"/>
<text x="760.0" y="1336" font-size="23" text-anchor="middle" fill="#bf286e">COMMIT：冻结数据，翻转 req</text>
<rect x="1274.6953125" y="1376" width="340.609375" height="32" fill="#ffffff"/>
<text x="1445.0" y="1401" font-size="23" text-anchor="middle" fill="#25638d">req 经 2FF；捕获 pending_cfg</text>
<rect x="1277.0390625" y="1541" width="335.921875" height="32" fill="#ffffff"/>
<text x="1445.0" y="1566" font-size="23" text-anchor="middle" fill="#197b71">切换后 ACK 返回，经 2FF 同步</text>
<rect x="591.7421875" y="1601" width="336.515625" height="32" fill="#ffffff"/>
<text x="760.0" y="1626" font-size="23" text-anchor="middle" fill="#bf286e">BUSY 清除，可提交下一份观察</text>
</g></svg>