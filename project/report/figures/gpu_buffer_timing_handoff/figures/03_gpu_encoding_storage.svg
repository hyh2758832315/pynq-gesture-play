<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1850" viewBox="0 0 2200 1850">
<rect x="0" y="0" width="2200" height="1850" fill="#ffffff"/>
<defs>
<marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#197b71"/></marker>
<marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf286e"/></marker>
</defs><g font-family="Microsoft YaHei" fill="#172b3a">
<rect x="60" y="240" width="2080" height="410" rx="0" fill="#edf5fb" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="278.0" text-anchor="start" font-size="27" font-weight="600">Scene / 固定 4,160 B，小端 32 bit 字</text>
<rect x="60" y="690" width="2080" height="360" rx="0" fill="#edf8f5" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="728.0" text-anchor="start" font-size="27" font-weight="600">像素编码 / 素材与帧缓冲使用不同位宽</text>
<rect x="60" y="1090" width="2080" height="360" rx="0" fill="#fff0f6" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="1128.0" text-anchor="start" font-size="27" font-weight="600">双帧缓冲的逻辑容量 / 同为 320 × 180，按像素编码直接计算</text>
<rect x="60" y="1490" width="2080" height="245" rx="0" fill="#f5f7fa" stroke="#d8dfe7" stroke-width="2.6"/>
<text x="82" y="1528.0" text-anchor="start" font-size="27" font-weight="600">资源提交与视频节拍</text>
<path d="M650,850 L735,850" fill="none" stroke="#197b71" stroke-width="2.7" marker-end="url(#arrow0)"/>
<path d="M1405,850 L1490,850" fill="none" stroke="#bf286e" stroke-width="2.7" marker-end="url(#arrow1)"/>
<text x="1100.0" y="49.14" text-anchor="middle" font-size="21" font-weight="600">PYNQ  /  GPU 缓冲与呈现时序  /  03  编码与存储</text>
<text x="1100.0" y="129.98" text-anchor="middle" font-size="47" font-weight="600">小命令包驱动绘制，索引 token 驱动扫描</text>
<text x="1100.0" y="196.5" text-anchor="middle" font-size="25" font-weight="600">Scene 描述怎么画；帧缓冲保存画好的像素索引；调色板在扫描时展开为 RGB。</text>
<text x="1100.0" y="1821.62" text-anchor="middle" font-size="18" font-weight="600">GESTURE PLAY · v3.0 / R15b · BUILD_ID 0xC0061000 · 当前源码机制</text>
<rect x="100" y="330" width="600" height="130" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="400.0" y="371.0" text-anchor="middle" font-size="25" font-weight="600">64 B Header / 16 words</text>
<text x="400.0" y="403.5" text-anchor="middle" font-size="25" font-weight="400">S2DG · frame_id · submit_seq</text>
<text x="400.0" y="436.0" text-anchor="middle" font-size="25" font-weight="400">command_count · 资源 generation</text>
<rect x="750" y="330" width="1340" height="130" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="1420.0" y="371.0" text-anchor="middle" font-size="25" font-weight="600">4,096 B Command bank = 128 × 32 B</text>
<text x="1420.0" y="403.5" text-anchor="middle" font-size="25" font-weight="400">每条 8 words；未使用区域补 0</text>
<text x="1420.0" y="436.0" text-anchor="middle" font-size="25" font-weight="400">CLEAR 0x01 / TILE 0x02 / BLIT 0x03 / RECT 0x04 / END 0xFF</text>
<text x="400.0" y="532.56" text-anchor="middle" font-size="24" font-weight="600">FILL_RECT 构造示例</text>
<text x="400.0" y="563.76" text-anchor="middle" font-size="24" font-weight="400">x=10，y=20，w=32，h=16</text>
<rect x="750" y="490" width="1340" height="105" rx="6" fill="#f5f7fa" stroke="#d8dfe7" stroke-width="2"/>
<text x="1420.0" y="534.75" text-anchor="middle" font-size="25" font-weight="600">word0=0x00000004   word1=0x000000F7</text>
<text x="1420.0" y="567.25" text-anchor="middle" font-size="25" font-weight="400">word2=0x0014000A   word3=0x00100020   word4–7=0</text>
<rect x="100" y="785" width="550" height="130" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="375.0" y="826.9599999999999" text-anchor="middle" font-size="24" font-weight="600">素材 INDEX4 / 每像素 4 bit</text>
<text x="375.0" y="858.16" text-anchor="middle" font-size="24" font-weight="400">像素 [1,2,3,4] → 字节 [21,43]hex</text>
<text x="375.0" y="889.3599999999999" text-anchor="middle" font-size="24" font-weight="400">BLIT 遇到 index 0 跳过写入</text>
<rect x="735" y="785" width="670" height="130" rx="6" fill="#ffffff" stroke="#bf286e" stroke-width="2"/>
<text x="1070.0" y="826.0" text-anchor="middle" font-size="25" font-weight="600">帧缓冲 token / 每像素 8 bit</text>
<text x="1070.0" y="858.5" text-anchor="middle" font-size="25" font-weight="400">[7:4] 逻辑调色板组 | [3:0] 色号</text>
<text x="1070.0" y="891.0" text-anchor="middle" font-size="25" font-weight="400">0xF7 → 第 15 组，第 7 色</text>
<rect x="1490" y="785" width="600" height="130" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="1790.0" y="826.0" text-anchor="middle" font-size="25" font-weight="600">Palette 查表 → RGB888</text>
<text x="1790.0" y="858.5" text-anchor="middle" font-size="25" font-weight="400">逻辑 16 组 × 每组 16 色</text>
<text x="1790.0" y="891.0" text-anchor="middle" font-size="25" font-weight="400">物理 active bank 为独立的 0 / 1</text>
<text x="1095.0" y="995.16" text-anchor="middle" font-size="24" font-weight="600">逻辑调色板组、物理调色板 bank、命令 bank、帧缓冲 bank 是四种不同索引，不能合并画成一组。</text>
<text x="385.0" y="1228.5" text-anchor="middle" font-size="25" font-weight="600">当前：2 × 320 × 180 × 1 B</text>
<rect x="710" y="1190" width="400" height="60" rx="6" fill="#f4c6db" stroke="#bf286e" stroke-width="2"/>
<text x="910.0" y="1228.16" text-anchor="middle" font-size="24" font-weight="600">112.5 KiB</text>
<text x="385.0" y="1328.5" text-anchor="middle" font-size="25" font-weight="600">对照：2 × 320 × 180 × 3 B</text>
<rect x="710" y="1290" width="1200" height="60" rx="6" fill="#edf5fb" stroke="#25638d" stroke-width="2"/>
<text x="1310.0" y="1328.16" text-anchor="middle" font-size="24" font-weight="600">337.5 KiB / RGB888</text>
<text x="1095.0" y="1412.82" text-anchor="middle" font-size="23" font-weight="600">8 bit token 容量为同分辨率 RGB888 的 1/3；不含 Palette、Atlas、Tilemap 和 BRAM 块取整。</text>
<rect x="100" y="1575" width="930" height="105" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="565.0" y="1620.0600000000002" text-anchor="middle" font-size="24" font-weight="600">Atlas / Tilemap：渲染空闲时提交</text>
<text x="565.0" y="1651.2600000000002" text-anchor="middle" font-size="24" font-weight="400">Palette：独立等 vblank，ACK 后 generation 生效</text>
<rect x="1100" y="1575" width="990" height="105" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="1595.0" y="1620.0600000000002" text-anchor="middle" font-size="24" font-weight="600">视频：必要时 Palette → 每帧 Atlas → Scene</text>
<text x="1595.0" y="1651.2600000000002" text-anchor="middle" font-size="24" font-weight="400">目标 30 fps；每帧串行提交，与 60 Hz HDMI 扫描分开</text>
<text x="1100.0" y="1787.16" text-anchor="middle" font-size="24" font-weight="600">资源上传前 drain；每份资源确认 accepted 与 generation 后，再提交引用这些版本的 Scene。</text>
</g></svg>