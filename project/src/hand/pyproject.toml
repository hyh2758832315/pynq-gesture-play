[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynq-usb-hand"
version = "0.1.0"
requires-python = ">=3.10"
description = "Standalone four-button ORCA SCS225 hand controller"
dependencies = []

[project.scripts]
pynq-usb-hand = "pynq_usb_hand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]