<text x="1095.0" y="1662.66" text-anchor="middle" font-size="24" font-weight="600">720p 时序：1650 × 750 / 74.25 MHz = 16.67 ms / 帧；这是扫描周期，不是渲染耗时。</text>
<text x="1100.0" y="1790.16" text-anchor="middle" font-size="24" font-weight="600">呈现须核对 count 与 seq。present_completed_seq 在启动渲染时已写入，单看 seq 不能证明换页完成。</text>
