<text x="1100.0" y="49.14" text-anchor="middle" font-size="21" font-weight="600">PYNQ  /  视觉识别与双路跟随  /  02  识别逻辑</text>
<text x="1100.0" y="129.98" text-anchor="middle" font-size="47" font-weight="600">位置可先跟随，类别经过多帧确认</text>
<text x="1100.0" y="196.5" text-anchor="middle" font-size="25" font-weight="600">确定手在哪里，与确定是握拳 / 剪刀 / 张手，使用不同特征与有效性条件。</text>
<text x="1100.0" y="1661.62" text-anchor="middle" font-size="18" font-weight="600">GESTURE PLAY  ·  v3.0 / R15b / R16  ·  BUILD_ID 0xC0061000  ·  源码机制示意</text>
<rect x="100" y="325" width="440" height="112" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="320.0" y="373.25" text-anchor="middle" font-size="25" font-weight="600">滤波掩膜 → 外轮廓</text>
<text x="320.0" y="405.75" text-anchor="middle" font-size="25" font-weight="400">候选面积 ≥ 2000 px²</text>
<rect x="620" y="325" width="440" height="112" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="840.0" y="373.25" text-anchor="middle" font-size="25" font-weight="600">选取当前目标</text>
<text x="840.0" y="405.75" text-anchor="middle" font-size="25" font-weight="400">面积 + 重叠 + 距离连续性</text>
<rect x="1140" y="325" width="440" height="112" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="1360.0" y="373.25" text-anchor="middle" font-size="25" font-weight="600">轮廓 / 凸包 / 凸缺陷</text>
<text x="1360.0" y="405.75" text-anchor="middle" font-size="25" font-weight="400">提取 A、Aₕ、n</text>
<rect x="1660" y="325" width="440" height="112" rx="6" fill="#ffffff" stroke="#197b71" stroke-width="2"/>
<text x="1880.0" y="373.25" text-anchor="middle" font-size="25" font-weight="600">原掩膜 ∩ 选中轮廓</text>
<text x="1880.0" y="405.75" text-anchor="middle" font-size="25" font-weight="400">像素矩得到位置质心</text>
<text x="595.0" y="506.56" text-anchor="middle" font-size="24" font-weight="600">候选按面积保留至多 8 个</text>
<text x="595.0" y="537.76" text-anchor="middle" font-size="24" font-weight="400">评分 = A/Amax + 2·IoU + max(0, 1−3d)</text>
<text x="1625.0" y="506.56" text-anchor="middle" font-size="24" font-weight="600">cx = Σx / N，cy = Σy / N</text>
<text x="1625.0" y="537.76" text-anchor="middle" font-size="24" font-weight="400">仅统计原掩膜选中像素，排除膨胀新增区域</text>
<text x="565.0" y="739.13" text-anchor="middle" font-size="27" font-weight="600">r = (Aₕ − A) / A × 100%</text>
<text x="565.0" y="774.23" text-anchor="middle" font-size="27" font-weight="400">n = 合格凸缺陷数 + 1（形状特征）</text>
<rect x="95" y="814" width="245" height="62" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="217.5" y="853.5" text-anchor="middle" font-size="25" font-weight="600">握拳 / 0</text>
<text x="690.0" y="853.5" text-anchor="middle" font-size="25" font-weight="600">n = 1 且 r &lt; 15%</text>
<rect x="95" y="890" width="245" height="62" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="217.5" y="929.5" text-anchor="middle" font-size="25" font-weight="600">剪刀 / 2</text>
<text x="690.0" y="929.5" text-anchor="middle" font-size="25" font-weight="600">n = 2 且 r ≥ 15%</text>
<rect x="95" y="966" width="245" height="62" rx="6" fill="#ffffff" stroke="#25638d" stroke-width="2"/>
<text x="217.5" y="1005.5" text-anchor="middle" font-size="25" font-weight="600">张手 / 5</text>
<text x="690.0" y="1005.5" text-anchor="middle" font-size="25" font-weight="600">3 ≤ n ≤ 5 且 18% ≤ r ≤ 55%</text>
<text x="565.0" y="1077.98" text-anchor="middle" font-size="22" font-weight="600">凸缺陷条件：夹角 ≤ 90°，深度 &gt; 随手尺寸缩放的阈值</text>
